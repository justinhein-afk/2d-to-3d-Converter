<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry Intro Preview</title>
<style>
  :root { --bg: #0D0D0D; --page: #050505; --fg: #FFFFFF; --muted: #8C8C8C; --accent: #2F6BFF; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    background: var(--page); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  canvas { display: block; background: var(--bg); border-radius: 12px; }
  .bar { display: flex; gap: 12px; align-items: center; width: 100%; max-width: 560px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button {
    background: var(--accent); color: var(--fg); border: 0; border-radius: 999px;
    padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; min-width: 84px;
  }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  .note { color: var(--muted); font-size: 12px; text-align: center; max-width: 560px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="20" step="0.001" value="0" aria-label="Timeline">
  <span class="time" id="time">0.00 / 20.00</span>
</div>
<p class="note">Live preview without motion blur. Audio comes from out/henry-intro.mp4 once it has been rendered. Add ?contact=@you to try a different contact line. Space toggles play; arrow keys step one frame.</p>
<script type="module">
  import { W, H, FPS, DURATION, FONTS, drawFrame, settings } from './src/scene.js';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  const playBtn = document.getElementById('play');
  canvas.width = W; canvas.height = H;
  scrub.max = DURATION;

  const contact = new URLSearchParams(location.search).get('contact');
  if (contact) settings.contact = contact;

  await Promise.all(FONTS.map(async (f) => {
    const face = new FontFace(f.family, `url(fonts/${f.file})`);
    await face.load();
    document.fonts.add(face);
  }));

  function fit() {
    const h = Math.min(window.innerHeight - 150, ((window.innerWidth - 32) * 16) / 9);
    canvas.style.height = `${h}px`;
    canvas.style.width = `${(h * 9) / 16}px`;
  }
  addEventListener('resize', fit);
  fit();

  const audio = new Audio('out/henry-intro.mp4');
  let audioOk = true;
  audio.addEventListener('error', () => { audioOk = false; });

  let t = 0, playing = false, clockStart = 0;
  function render() {
    drawFrame(ctx, t);
    scrub.value = t;
    timeEl.textContent = `${t.toFixed(2)} / ${DURATION.toFixed(2)}`;
  }
  function seek(v) {
    t = Math.max(0, Math.min(DURATION, v));
    if (audioOk) audio.currentTime = t;
    clockStart = performance.now() - t * 1000;
    render();
  }
  async function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? 'Pause' : 'Play';
    if (on) {
      if (t >= DURATION) seek(0);
      clockStart = performance.now() - t * 1000;
      if (audioOk) { try { audio.currentTime = t; await audio.play(); } catch { audioOk = false; } }
      requestAnimationFrame(tick);
    } else if (audioOk) {
      audio.pause();
    }
  }
  function tick() {
    if (!playing) return;
    t = audioOk && !audio.paused ? audio.currentTime : (performance.now() - clockStart) / 1000;
    if (t >= DURATION) { t = DURATION; render(); setPlaying(false); return; }
    render();
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => seek(Number(scrub.value)));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight') seek(t + 1 / FPS);
    if (e.code === 'ArrowLeft') seek(t - 1 / FPS);
  });
  render();
</script>
</body>
</html>
